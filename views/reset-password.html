<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Adtim Technologies</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-page-wrapper">
        <div class="login-form-container">
            <div class="login-box">
                <img src="/images/logo.png" alt="Logo" class="logo">
                <h1>Reset Password</h1>
                <div id="message" class="error-message"></div>
                <form id="reset-form">
                    <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
                    <button type="submit">Reset Password</button>
                </form>
                <p><a href="/login">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('message').textContent = 'Invalid reset link';
            document.getElementById('message').style.display = 'block';
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            if (newPassword !== confirmPassword) {
                messageDiv.textContent = 'Passwords do not match';
                messageDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/password-resets/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.style.backgroundColor = '#d4edda';
                    messageDiv.style.color = '#155724';
                    messageDiv.textContent = 'Password reset successfully! You can now login.';
                    messageDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageDiv.textContent = result.error || 'Reset failed';
                    messageDiv.style.display = 'block';
                }
            } catch (error) {
                messageDiv.textContent = 'Network error. Please try again.';
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
