<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Adtim Technologies Limited</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/images/fav.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Adtim Finance">
</head>

<body>
    <div class="login-page-wrapper">
        <div class="login-form-container">
            <div class="login-box">
                <img src="/images/logo.png" alt="Logo" class="logo">
                <h1>Welcome</h1>
                <p class="login-subtitle">Login to your account</p>
                <div id="error-message" class="error-message"></div>
                <form id="login-form">
                    <input type="text" id="loginIdentifier" placeholder="Username or Email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p><a href="#" id="forgot-password-link">Forgot Password?</a></p>
            </div>
        </div>
        
        <!-- Password Change Modal -->
        <div id="password-change-modal" class="modal" style="display:none">
            <div class="modal-content">
                <h2>Password Change Required</h2>
                <p>You must change your password before continuing.</p>
                <form id="password-change-form">
                    <input type="password" id="new-password" placeholder="New Password" required minlength="6">
                    <input type="password" id="confirm-password" placeholder="Confirm New Password" required minlength="6">
                    <button type="submit">Change Password</button>
                </form>
                <div id="password-error" class="error-message"></div>
            </div>
        </div>
        
        <!-- Forgot Password Modal -->
        <div id="forgot-password-modal" class="modal" style="display:none">
            <div class="modal-content">
                <span class="close" onclick="document.getElementById('forgot-password-modal').style.display='none'">&times;</span>
                <h2>Reset Password</h2>
                <p>Enter your username or email to request a password reset.</p>
                <form id="forgot-password-form">
                    <input type="text" id="reset-identifier" placeholder="Username or Email" required>
                    <button type="submit">Request Reset</button>
                </form>
                <div id="reset-message" class="error-message"></div>
            </div>
        </div>
        <div class="login-banner-container">
            <img src="/images/Logo-Adtim.gif" alt="Financial Planning Banner">
            <div class="banner-overlay">
                <h2>Adtim Technologies (U) Limited</h2>
                <p>Financial Management.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginIdentifier = document.getElementById('loginIdentifier').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginIdentifier, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.accessToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Check if password change is required
                    if (data.user.must_change_password) {
                        showPasswordChangeModal(data.user.id, data.accessToken);
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorDiv.textContent = data.message || 'Login failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
        
        function showPasswordChangeModal(userId, token) {
            document.getElementById('password-change-modal').style.display = 'block';
            
            document.getElementById('password-change-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const errorDiv = document.getElementById('password-error');
                
                if (newPassword !== confirmPassword) {
                    errorDiv.textContent = 'Passwords do not match';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                try {
                    const response = await fetch(`/api/users/${userId}/change-password`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ newPassword })
                    });
                    
                    const result = await response.json();
                    
                    if (response.ok) {
                        alert('Password changed successfully!');
                        window.location.href = '/dashboard';
                    } else {
                        errorDiv.textContent = result.error || 'Failed to change password';
                        errorDiv.style.display = 'block';
                    }
                } catch (error) {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.style.display = 'block';
                }
            });
        }
        
        document.getElementById('forgot-password-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('forgot-password-modal').style.display = 'block';
        });
        
        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('reset-identifier').value;
            const messageDiv = document.getElementById('reset-message');
            
            try {
                const response = await fetch('/api/password-resets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.style.backgroundColor = '#d4edda';
                    messageDiv.style.color = '#155724';
                    messageDiv.textContent = 'Password reset request submitted. Contact your administrator.';
                    messageDiv.style.display = 'block';
                    document.getElementById('reset-identifier').value = '';
                } else {
                    messageDiv.textContent = result.error || 'Failed to request reset';
                    messageDiv.style.display = 'block';
                }
            } catch (error) {
                messageDiv.textContent = 'Network error. Please try again.';
                messageDiv.style.display = 'block';
            }
        });
        
        // PWA Install Prompt for login page
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            const installBtn = document.createElement('button');
            installBtn.textContent = '📱 Install App';
            installBtn.style.cssText = 'position: fixed; top: 10px; right: 10px; z-index: 1000; padding: 8px 12px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;';
            
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    installBtn.remove();
                }
            });
            
            document.body.appendChild(installBtn);
        });
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
